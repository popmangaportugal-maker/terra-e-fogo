<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anúncios — Terra & Fogo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><span class="ring"></span> Terra &amp; Fogo</a>
    <nav class="main-nav">
      <a href="loja.html">Loja</a>
      <a href="workshops.html">Workshops</a>
      <a href="videos.html">Vídeos</a>
      <a href="noticias.html" class="active">Anúncios</a>
      <a href="contacto.html">Contacto</a>
    </nav>
    <div class="header-actions">
      <a href="carrinho.html" class="cart-link">Carrinho <span data-cart-count style="display:none">0</span></a>
      <button class="menu-toggle" aria-label="Abrir menu">☰</button>
    </div>
  </div>
</header>

<section style="padding-bottom:0;">
  <div class="wrap">
    <span class="eyebrow">Novidades do atelier</span>
    <h1 style="font-size:clamp(32px,4vw,48px); margin:12px 0 8px;">Anúncios</h1>
    <p class="lede">Fornadas novas, vagas em workshops e outras novidades — substitui pelo conteúdo real à medida que for saindo.</p>
  </div>
</section>

<section>
  <div class="wrap" id="news-list" style="display:flex; flex-direction:column; gap:0; max-width:820px;"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© <span data-year></span> Terra &amp; Fogo</span>
    </div>
  </div>
</footer>

<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
(async function () {
  const res = await fetch("content/noticias.json");
  const NEWS = (await res.json()).items;
  document.getElementById("news-list").innerHTML = NEWS.map(n => `
    <article style="padding:28px 0; border-bottom:1px solid var(--linha); display:grid; grid-template-columns:140px 1fr; gap:24px;">
      <div style="font-family:var(--mono); font-size:12px; color:var(--biscuit-dim); padding-top:4px;">${n.data}</div>
      <div>
        <span class="pill">${n.pill}</span>
        <h3 class="card-title" style="margin:10px 0 8px;">${n.titulo}</h3>
        <p style="color:var(--biscuit-dim); margin:0; max-width:60ch;">${n.texto}</p>
      </div>
    </article>
  `).join("");
})();
</script>
</body>
</html>
