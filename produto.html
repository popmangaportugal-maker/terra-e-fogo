<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Peça — Terra & Fogo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><span class="ring"></span> Terra &amp; Fogo</a>
    <nav class="main-nav">
      <a href="loja.html" class="active">Loja</a>
      <a href="workshops.html">Workshops</a>
      <a href="videos.html">Vídeos</a>
      <a href="noticias.html">Anúncios</a>
      <a href="contacto.html">Contacto</a>
    </nav>
    <div class="header-actions">
      <a href="carrinho.html" class="cart-link">Carrinho <span data-cart-count style="display:none">0</span></a>
      <button class="menu-toggle" aria-label="Abrir menu">☰</button>
    </div>
  </div>
</header>

<section style="padding-bottom:0;">
  <div class="wrap">
    <a href="loja.html" style="font-family:var(--mono); font-size:13px; color:var(--biscuit-dim);">&larr; voltar à loja</a>
  </div>
</section>

<section id="product-section"></section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© <span data-year></span> Terra &amp; Fogo</span>
      <span>Todas as peças são feitas à mão — pequenas variações fazem parte do processo.</span>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
(async function () {
  await loadProducts();
  const id = new URLSearchParams(location.search).get("id");
  const p = getProduct(id);
  const section = document.getElementById("product-section");

  if (!p) {
    section.innerHTML = `
      <div class="wrap center" style="padding:60px 0;">
        <h2>Peça não encontrada</h2>
        <p class="lede" style="margin:16px auto;">Esta peça pode já ter sido vendida — cada uma é única.</p>
        <a href="loja.html" class="btn btn-primary">Ver outras peças</a>
      </div>`;
  } else {
    document.getElementById("page-title").textContent = p.nome + " — Terra & Fogo";
    section.innerHTML = `
      <div class="wrap two-col">
        <div class="card-media" style="border-radius:3px; border:1px solid var(--tenmoku-3);">
          <img src="${p.img}" alt="${p.nome}">
        </div>
        <div>
          <span class="eyebrow">${CATS_LABEL(p.categoria)}</span>
          <h1 style="font-size:clamp(30px,3.6vw,44px); margin:14px 0 16px;">${p.nome}</h1>
          <p class="lede">${p.descricao}</p>
          <div class="price" style="font-size:26px; margin:24px 0;">${formatEUR(p.preco)}</div>
          <div style="display:flex; gap:12px; align-items:center; margin-bottom:28px;">
            <button class="btn btn-primary" id="add-btn">Adicionar ao carrinho</button>
            <a href="carrinho.html" class="btn btn-outline">Ver carrinho</a>
          </div>
          <div class="ring-divider">ficha técnica</div>
          <div style="font-family:var(--mono); font-size:14px; color:var(--biscuit-dim); display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;">
            <span>Altura <b style="color:var(--biscuit);">${p.altura}</b></span>
            <span>Diâmetro <b style="color:var(--biscuit);">${p.diametro}</b></span>
            <span>Vidrado <b style="color:var(--biscuit);">${p.vidrado}</b></span>
            <span>Cozedura <b style="color:var(--biscuit);">${p.forno}</b></span>
            <span>Disponíveis <b style="color:var(--biscuit);">${p.stock}</b></span>
          </div>
        </div>
      </div>`;
    document.getElementById("add-btn").addEventListener("click", () => addToCart(p.id));
  }

  function CATS_LABEL(cat) {
    const map = { vasos: "Vasos", tacas: "Taças", canecas: "Canecas", pratos: "Pratos", cha: "Chá" };
    return map[cat] || cat;
  }
})();
</script>
</body>
</html>
